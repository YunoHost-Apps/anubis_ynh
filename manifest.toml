#:schema https://raw.githubusercontent.com/YunoHost/apps/master/schemas/manifest.v2.schema.json

packaging_format = 2

id = "anubis"
name = "Anubis"
description.en = "Proof-of-work to stop AI crawlers"
description.fr = "Preuve de travail pour stopper les robots d'indexation de l'IA"

version = "1.26.0.pre1~ynh1"

maintainers = []

[upstream]
license = "MIT"
website = "https://anubis.techaro.lol/"
admindoc = "https://anubis.techaro.lol/docs/admin/installation"
code = "https://github.com/TecharoHQ/anubis"
fund = "https://www.patreon.com/cadey"

[integration]
yunohost = ">= 12.1.39"
helpers_version = "2.1"
architectures = "all"
multi_instance = true

ldap = false
sso = false

disk = "50M"
ram.build = "50M"
ram.runtime = "50M"

[install]
    [install.domain]
    type = "domain"

    [install.init_main_permission]
    type = "group"
    default = "visitors"

[resources]

    [resources.sources]

    [resources.sources.main]
    amd64.url = "https://github.com/TecharoHQ/anubis/releases/download/v1.26.0-pre1/anubis-1.26.0-pre1-linux-amd64.tar.gz"
    amd64.sha256 = "166985ae44f3006d3ffd87ede8621bda7d171cc66ff6d4c58ad029938381979d"
    arm64.url = "https://github.com/TecharoHQ/anubis/releases/download/v1.26.0-pre1/anubis-1.26.0-pre1-linux-arm64.tar.gz"
    arm64.sha256 = "cba947af7abef80e5a463a4e11a046f8015e639bb921cbf67f3f2dc5edf47174"
    
    autoupdate.strategy = "latest_github_release"

    [resources.system_user]

    [resources.install_dir]

    [resources.permissions]
    main.url = "/"

    [resources.ports]
